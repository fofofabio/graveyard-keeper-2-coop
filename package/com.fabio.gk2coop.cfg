[Coop]

## Mirror quest transitions between players, so one player's work advances the story for both.
ShareQuestProgress = true

## Create each drop once and mirror it. The host authorizes pickup before crediting one player, so contested and failed pickup conserve items. Overrides RemoteDeathDrops.
ShareDrops = true

## Mirror world-container contents through a host-assigned snapshot revision. Concurrent edits converge to the host's last received snapshot; they are not merged or safe as crafting transactions.
ShareContainers = true

## How many times a client retries a connection that starts but never reaches the host. One miss would otherwise leave the player alone in their own world.
ConnectRetries = 5

## Seconds to wait for a connection attempt to reach the host before retrying it.
ConnectRetrySeconds = 10

## Count messages and bytes leaving this machine, reported every 30 seconds with the peer count.
MeasureNetworkVolume = true

## Replay this session's world changes to a client that joins later, so it matches a world already in progress. Does not carry per-player inventory or energy.
SendJoinSnapshot = true

## Mirror world-object deaths to the other machine so both players see the same world.
ReplicateWorldDeaths = true

## Let a mirrored death also produce its drops and quest effects locally, duplicating the resource. Superseded by ShareDrops and ignored while it is on.
RemoteDeathDrops = false

## Phase 2 experiment: replicate applying a tool to a world object, executed inside the acting player's context.
ReplicateToolUse = false

[Diagnostics]

## Automated development probe. Keep disabled for ordinary play.
MovementProbe = false

## Forward the game's own errors and networking messages into the BepInEx log.
UnityLogBridge = true

## Log the component graph, ownership, and position of every player body when it changes.
PlayerCensus = true

## Count serialized/deserialized commands and report replicated movement.
CommandTelemetry = true

[Fixes]

## The game skips every post-death effect on a co-op client, so a client gets no drops and no quest progress from anything it kills. Let it run that logic locally.
ClientRunsDeathLogic = true

## Keep remote player bodies kinematic so replicated MoveByPosition is accepted instead of rejected.
RemoteBodyKinematic = true

## Spawn a remote player at the local player's position instead of the origin, until its first movement update arrives.
SeedRemoteSpawnPosition = true

## Re-apply the standard preset and colour palette to remote bodies. Off by default: the prefab appearance is already correct, and the intro chains this was meant to solve were an animation state, not a skin.
RemoteBodyAppearance = false

## Move a remote body into the same scene as the local player body instead of leaving it in whichever scene happened to be active.
MatchRemoteBodyScene = true

[Session]

## Name shown above your character and in the status panel. Blank uses Host or Player N.
PlayerName =

## Stream this machine's plugin log to the host when running as a client, so one log file holds both sides of a test.
RelayLogToHost = true

## Let the host's in-game clock correct the client's. One in-game day is five real minutes, so drift accumulates quickly.
ClockSync = true

## Host only. Refresh the network socket a second after a player leaves, so a player whose game crashed can rejoin. Works around a receive-buffer leak in the game's network library; turn off only to diagnose connection problems.
RebindAfterClientLeaves = true

[Network]

## Host address used when StartupMode is Connect.
Address = 127.0.0.1

## Initialize the dormant native network services after MainScene loads.
AutoInitialize = true

## UDP port used by Unity Transport.
Port = 8889

## None, Host, or Connect. Configure this separately on each PC.
StartupMode = None

[UI]

## Show or hide the co-op diagnostics window.
OverlayKey = F8

## Show the small multiplayer status panel.
ShowSessionStatus = true

## Show player names above characters.
ShowNameTags = true

## Toggle the multiplayer status panel.
SessionStatusKey = F6

## Toggle name tags above characters.
NameTagKey = F7

## Show the co-op setup panel on the main menu, so hosting or joining needs no config editing.
ShowCoopMenu = true
